{% extends "layout.html" %}
{% block content %}
<div class="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900/80 p-4 shadow-2xl shadow-slate-950/40 backdrop-blur-sm sm:p-8">
    <div class="mb-5 text-center sm:mb-6">
        <p class="text-[10px] font-semibold uppercase tracking-[0.3em] text-yellow-400 sm:text-xs">Pembayaran</p>
        <h2 class="mt-3 text-2xl font-black text-white sm:text-3xl">DETAIL CHECKOUT</h2>
    </div>

    <div class="mb-5 rounded-2xl border border-yellow-500/20 bg-slate-950/50 p-4 text-center sm:mb-6 sm:p-5">
        <p class="text-xs text-slate-400 sm:text-sm">Skin yang dipilih</p>
        <p class="mt-2 text-lg font-black text-white sm:text-xl">{{ skin_name }}</p>
    </div>

    {% if error %}
        <div class="mb-4 rounded-xl border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-200">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" class="space-y-4 sm:space-y-5">
        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-300">ID Akun MLBB</label>
            <div class="flex flex-col gap-3 sm:flex-row">
                <input type="text" name="ml_id" required placeholder="User ID" class="w-full rounded-xl border border-slate-700 bg-slate-950/50 px-3 py-3 text-white outline-none transition focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/20 sm:w-2/3 sm:px-4">
                <input type="text" name="zone_id" required placeholder="Zone" class="w-full rounded-xl border border-slate-700 bg-slate-950/50 px-3 py-3 text-white outline-none transition focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/20 sm:w-1/3 sm:px-4">
            </div>
        </div>

        <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-emerald-400 to-green-500 px-4 py-3 text-sm font-black text-white shadow-lg shadow-emerald-500/20 transition hover:brightness-110 sm:text-base">
            TEKAN TOMBOL KIRIM
        </button>
    </form>
</div>
{% endblock %}
