{% extends "layout.html" %}
{% block content %}
<div class="w-full max-w-md rounded-3xl border border-yellow-500/20 bg-slate-900/80 p-4 shadow-2xl shadow-yellow-500/10 backdrop-blur-sm sm:p-8">
    <div class="mb-5 text-center sm:mb-6">
        <p class="text-[10px] font-semibold uppercase tracking-[0.3em] text-yellow-400 sm:text-xs">peringatan hanya satu akun untuk satu skin!!!</p>
        <h2 class="mt-3 text-2xl font-black text-white sm:text-3xl">Silahkan Login</h2>
    </div>

    <p class="mb-5 text-center text-xs leading-relaxed text-slate-400 sm:mb-6 sm:text-sm">
    jika login gagal, silahkan ganti akun email yang lain!!!
    </p>

    {% if error %}
        <div class="mb-4 rounded-xl border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-200">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" class="space-y-4 sm:space-y-5">
        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-300">Username</label>
            <input type="text" name="username" required class="w-full rounded-xl border border-slate-700 bg-slate-950/50 px-3 py-3 text-white outline-none transition focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/20 sm:px-4" placeholder="Masukkan username">
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-300">Password</label>
            <input type="password" name="password" required class="w-full rounded-xl border border-slate-700 bg-slate-950/50 px-3 py-3 text-white outline-none transition focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500/20 sm:px-4" placeholder="Masukkan password">
        </div>

        <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-yellow-400 to-orange-500 px-4 py-3 text-sm font-black text-slate-900 shadow-lg shadow-yellow-500/20 transition hover:brightness-110 sm:text-base">
            LOGIN
        </button>
    </form>
</div>
{% endblock %}
