{% extends "layout.html" %}
{% block content %}
<div class="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900/80 p-8 text-center shadow-2xl shadow-slate-950/40">
    <div class="mx-auto mb-6 h-16 w-16 animate-spin rounded-full border-4 border-yellow-400/30 border-t-yellow-400"></div>
    <p class="text-xs font-semibold uppercase tracking-[0.35em] text-yellow-400">Proses</p>
    <h2 class="mt-3 text-3xl font-black text-white">Pesanan Sedang Diproses</h2>

    <div class="mt-6 rounded-2xl border border-slate-700 bg-slate-950/60 p-4 text-sm text-slate-300">
        ID Akun Anda: <strong class="text-white">{{ ml_id }}</strong>
    </div>

    <div class="mt-6 inline-block rounded-2xl bg-slate-950/80 px-6 py-4 font-mono text-4xl font-black tracking-[0.25em] text-white" id="countdown">02:00</div>
    <p id="statusText" class="mt-4 text-sm text-slate-400">Mohon jangan menutup halaman ini sampai hitung mundur selesai.</p>
</div>

<script>
    let timeRemaining = 120;
    const countdownElement = document.getElementById('countdown');
    const statusText = document.getElementById('statusText');

    const timer = setInterval(() => {
        const minutes = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
        const seconds = String(timeRemaining % 60).padStart(2, '0');
        countdownElement.textContent = `${minutes}:${seconds}`;

        if (timeRemaining <= 0) {
            clearInterval(timer);
            countdownElement.textContent = 'SELESAI';
            countdownElement.classList.remove('text-white');
            countdownElement.classList.add('text-emerald-400');
            statusText.textContent = 'Pesanan Skin Anda berhasil diproses.';
            statusText.classList.remove('text-slate-400');
            statusText.classList.add('text-emerald-300');
            return;
        }

        timeRemaining -= 1;
    }, 1000);
</script>
{% endblock %}
